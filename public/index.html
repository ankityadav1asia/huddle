<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d11f28">
  <title>Huddle Watch Party</title>
  <meta name="description" content="Prototype: cricket, F1, basketball and hockey watch parties with friends, match intelligence and an AI Co-host.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="watch.css">
</head>
<body>
  <div class="stage">
    <aside class="rail" id="rail" aria-label="Watch party details"></aside>

    <main class="phone">
      <div class="app" id="app">
        <div class="view" id="view">
          <div class="scroll-body"><div class="skeleton"></div><div class="skeleton"></div></div>
        </div>
        <div class="toast" id="toast" role="status" hidden></div>
        <div class="sheet-layer" id="sheet-layer" hidden>
          <div class="sheet-backdrop" data-close></div>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
        </div>
      </div>
    </main>
  </div>
  <noscript>Huddle needs JavaScript to run the watch party.</noscript>
  <script type="module" src="watch/app.js"></script>
</body>
</html>
